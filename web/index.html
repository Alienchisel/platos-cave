<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07080b">
<title>Plato's Cave</title>
<style>
  /* Committed to one visual world: a dithered phosphor display. A light ground
     would wash the dither out, so there is no light theme by choice. Every
     colour here is lifted from the game's own palette. */
  :root{
    --ground:#07080b; --panel:#0d0f15; --rule:#1b1f28;
    --dim:#6a7080; --text:#aeb4c2; --sun:#fff6d6; --fire:#ec7424;
    --gap:clamp(10px,2.2vh,20px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ground);color:var(--text);
    font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:var(--gap);padding:var(--gap);overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:manipulation}

  header{display:flex;flex-direction:column;align-items:center;gap:4px}
  h1{margin:0;font-size:12px;font-weight:600;letter-spacing:.34em;
    text-indent:.34em;color:var(--sun);text-transform:uppercase}
  .sub{margin:0;font-size:11px;color:var(--dim);letter-spacing:.05em}

  canvas{image-rendering:pixelated;image-rendering:crisp-edges;
    display:block;border:1px solid var(--rule);
    max-width:100%;box-shadow:0 0 0 1px #000,0 18px 50px -20px #000}

  #hud{display:flex;flex-wrap:wrap;justify-content:center;
    gap:6px 18px;font-size:12px;color:var(--dim);
    font-variant-numeric:tabular-nums}
  #hud b{color:var(--text);font-weight:600}
  #hud .live{color:var(--fire)}
  #hud a{color:inherit;text-decoration:none;border-bottom:1px dotted #333944}
  #hud a:hover,#hud a:focus-visible{color:var(--text);border-bottom-color:var(--dim)}
  #hud a.pinned{color:var(--sun);border-bottom-color:#4a4636}
  :focus-visible{outline:1px solid var(--sun);outline-offset:2px}

  /* The constants actually under test. This is a tuning rig, so "it feels
     floaty" is only useful next to the number that makes it so. */
  #tune{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
    gap:6px 16px;padding-top:calc(var(--gap) * .6);
    border-top:1px solid var(--rule);font-size:11px;color:#4e5462;
    font-variant-numeric:tabular-nums;max-width:720px}
  #tune label{display:flex;align-items:center;gap:7px;white-space:nowrap}
  #tune i{font-style:normal;color:var(--dim);min-width:62px;text-align:right}
  #tune output{min-width:38px;color:var(--text)}
  #tune output.changed{color:var(--fire)}
  #tune input[type=range]{-webkit-appearance:none;appearance:none;
    width:94px;height:3px;background:var(--rule);border-radius:2px;outline:none}
  #tune input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;
    width:11px;height:11px;border-radius:50%;background:var(--sun);
    border:none;cursor:ew-resize}
  #tune input[type=range]::-moz-range-thumb{width:11px;height:11px;
    border-radius:50%;background:var(--sun);border:none;cursor:ew-resize}
  #tune button{font:inherit;font-size:11px;color:var(--dim);
    background:var(--panel);border:1px solid var(--rule);border-radius:3px;
    padding:2px 9px;cursor:pointer}
  #tune button:hover{color:var(--text);border-color:var(--dim)}
  #jump{gap:8px}
  #jumprow{display:inline-flex;align-items:center;gap:3px}
  #jumprow .pip{width:11px;height:11px;padding:0;border-radius:2px;
    border:1px solid #00000060;cursor:pointer}
  #jumprow .pip:hover{outline:1px solid var(--sun);outline-offset:1px}
  #jumprow .turn{width:1px;height:13px;background:var(--sun);margin:0 3px}

  kbd{background:var(--panel);border:1px solid var(--rule);border-radius:3px;
    padding:1px 6px;color:var(--text);font:inherit;font-size:11px}
  /* Play mode. The rig -- title, readout, sliders -- is what a desktop needs and
     a phone does not, and on a phone it is most of the screen. Hiding it is the
     part that works everywhere; the Fullscreen API below is a bonus where it
     exists. */
  #maxbtn,#sndbtn{position:fixed;top:calc(env(safe-area-inset-top) + 6px);
    z-index:10;width:30px;height:30px;padding:0;line-height:1;
    font:inherit;font-size:14px;color:var(--dim);
    background:#0d0f15c0;border:1px solid var(--rule);border-radius:4px;
    cursor:pointer;opacity:.55}
  #maxbtn{right:calc(env(safe-area-inset-right) + 6px)}
  #sndbtn{right:calc(env(safe-area-inset-right) + 42px)}
  #maxbtn:hover,#maxbtn:focus-visible,
  #sndbtn:hover,#sndbtn:focus-visible{opacity:1;color:var(--text)}
  #sndbtn.off{color:#3a3f4a}
  /* The rig is opt-in. It was the default when this page existed to find four
     numbers; the numbers are found, and four sliders and thirteen jump pips are
     most of a phone screen. */
  body:not(.rig) #tune{display:none}
  #rigbtn{font:inherit;font-size:11px;color:#4e5462;background:none;
    border:none;border-bottom:1px dotted #333944;padding:0;cursor:pointer}
  #rigbtn:hover,#rigbtn:focus-visible{color:var(--text)}
  body.max #rigbtn{display:none}

  body.max{gap:0;padding:0;justify-content:center;overflow:hidden}
  body.max header,body.max #hud,body.max #tune{display:none}
  body.max canvas{border:none;box-shadow:none}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* Phones. The canvas grows to fill the width here, so the column can exceed
     the viewport -- and body is overflow:hidden with justify-content:center,
     which would silently clip the top and bottom rather than letting you reach
     them. Anchor to the top and allow the scroll. */
  @media (max-width:560px){
    html,body{height:auto;min-height:100%}
    body{justify-content:flex-start;overflow-y:auto}
    #tune{max-width:100%}
    #tune input[type=range]{width:120px}
    #jumprow .pip{width:15px;height:15px}
  }
</style>

function fitCanvas() {

  // narrower than 480 css px, so a portrait phone was handed the raw 240x135 --

  // rig above and below it.

  const availW = innerWidth - (maxed ? 0 : 2 * GUTTER);
  const rig = document.body.classList.contains('rig');
  const share = maxed ? 1

    : (rig ? 0.74 : 0.82);

  // dither and fractional scaling moires it, so whole pixels are preferred --
  // but only up to a point: snapping 2.9 down to 2 discards a third of the
  // screen, which in landscape on a phone is the difference between a strip and
  // a game. Take the integer when it keeps most of the available size, and the
  // fractional size, unevenness included, when it does not.

  // in device pixels, so the nearest-neighbour blow-up starts from square
  // pixels and the dither survives it.

    // is per COLUMN, so without this the passage's vertical speed in px/s rises

    // against a player ceiling of 135, so the cave could climb about twice as
    // fast as anyone could follow, and late deaths were partly unavoidable.
    const scale = SPEED_START / speedAt(dist);
    this.drift += (this.r() * 2 - 1) * DRIFT_STEP * scale;
    const cap = DRIFT_CLAMP * scale;
    this.drift = clamp(this.drift, -cap, cap) * DRIFT_DAMP;
    this.centre += this.drift;

    if (this.centre < m) { this.centre = m; this.drift = Math.abs(this.drift); }
    if (this.centre > H - m) { this.centre = H - m; this.drift = -Math.abs(this.drift); }

  }

}

        banner: null, flashT: 0, capt: null, captT: 0, t: 0, state: 'ready',
        best: loadMyBest(), targets: buildTargets(), armed: false,
        deadT: 0, hitY: H / 2, wasHeld: false };
  if (typeof SND !== 'undefined') SND.thrust(false, 0);
}
// ΟΙ ΛΥΘΕΝΤΕΣ -- "those who were released". Seeded with the Neoplatonists above
// the Republic's cast, because the cast were never released: they sat in a house
// in the Piraeus and heard about someone who was.
const DEFAULT_SCORES = [
  ['ΠΛΩ', 33000], ['ΠΟΡ', 30200], ['ΙΑΜ', 27900], ['ΠΡΟ', 24100],
  ['ΔΑΜ', 20300], ['ΣΩΚ', 14600], ['ΓΛΑ', 7200], ['ΘΡΑ', 940],
];
const TABLE_LEN = 8;
const ALPHABET = 'ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ';   // no final sigma: never initial
const LONG_MS = 400;                            // press longer than this = confirm

function loadScores() {
  try {
    const v = JSON.parse(localStorage.getItem('pc_scores'));
    if (Array.isArray(v) && v.length) return v;
  } catch (e) { /* fall through to defaults */ }
  return DEFAULT_SCORES.map(([ini, dist]) => ({ ini, dist }));
}
function saveScores(t) { localStorage.setItem('pc_scores', JSON.stringify(t)); }

// The player's own best, tracked apart from the table. Reporting the table's
// top as "best" showed Plotinus's seeded 33000 next to your own run, which
// reads as a personal best and is not one.
function loadMyBest() { return +(localStorage.getItem('pc_mybest') || 0); }
function noteRun(d) {
  if (Math.round(d) > loadMyBest()) localStorage.setItem('pc_mybest', Math.round(d));
}
// Your initials persist. Three taps-and-holds per run is a real tax when you
// die every fifty seconds, and the name almost never changes. On the device
// this matters more, not less: one button, no keyboard, and NVS to hold it.
function loadIni() {
  const v = localStorage.getItem('pc_ini') || '';
  return [...v].length === 3 && [...v].every(c => ALPHABET.includes(c))
    ? [...v] : ['Α', 'Α', 'Α'];
}
function saveIni(ini) { localStorage.setItem('pc_ini', ini.join('')); }

// Everything worth chasing, as distances: the table plus your own best. Built
// once per run -- the table cannot change mid-flight, and rebuilding it every
// frame would read localStorage sixty times a second.
function buildTargets() {
  const mine = loadMyBest();
  // Drop any table entry sitting exactly on your best. A qualifying run leaves
  // one behind by construction, so without this nearly every player ends up
  // with their own initials twice on the same pixel -- and the chase readout,
  // which takes the first target ahead, could name a rival you have tied
  // instead of naming you.
  const t = loadScores().filter(r => r.dist !== mine)
                        .map(r => ({ at: r.dist, ini: r.ini, mine: false }));
  if (mine > 0) {
    // A best can exist before a name does: runs under the table's last entry
    // set a personal best without ever opening initials entry. ΣΥ is "you".
    const named = localStorage.getItem('pc_ini');
    t.push({ at: mine, ini: named ? loadIni().join('') : 'ΣΥ', mine: true });
  }
  return t.sort((a, b) => a.at - b.at);
}

// The lowest entry still above you: the next name to beat.
function nextAbove(d) {
  return loadScores().filter(r => r.dist > d).sort((a, b) => a.dist - b.dist)[0] || null;
}
function qualifies(d) {
  const t = loadScores();
  return t.length < TABLE_LEN || d > t[t.length - 1].dist;
}
function commitScore(ini, dist) {
  const t = loadScores();
  // `mine` survives the session, so you can still pick yourself out of the
  // Neoplatonists next time you open the page.
  t.push({ ini, dist: Math.round(dist), mine: true });
  t.sort((a, b) => b.dist - a.dist);
  saveScores(t.slice(0, TABLE_LEN));
}

let held = false, pressAt = 0;
function press() {
  if (!S) { reset(); return; }
  SND.wake();                 // browsers require a gesture; this is the first one
  pressAt = performance.now();
  if (S.state === 'title') { S.state = 'ready'; return; }
  if (S.state === 'ready') { S.state = 'play'; held = true; return; }
  if (S.state === 'play') { held = true; return; }
  // 'initials' resolves on release, since it needs the press duration.
  if (S.state === 'dead' || S.state === 'won') {
    // The frozen frame is skippable, but the press that skips it must not also
    // advance past it -- otherwise one impatient tap eats the death screen
    // whole and you never learn what you hit.
    if (S.deadT < DEATH_HOLD) { S.deadT = DEATH_HOLD; return; }
    if (S.pending) { S.pending = false; S.state = 'initials'; S.slot = 0;
                     S.ini = loadIni(); }
    else reset();
    return;
  }
  if (S.state === 'scores') { reset(); }
}
function release() {
  held = false;
  if (!S || S.state !== 'initials') return;
  // One button, arcade convention adapted: a tap steps the letter, a hold
  // commits it. This is the fallback if the StickS3 turns out to have only one
  // programmable button -- worth feeling before the hardware decides for us.
  if (performance.now() - pressAt >= LONG_MS) {
    if (++S.slot >= 3) {
      saveIni(S.ini);
      commitScore(S.ini.join(''), S.dist);
      S.state = 'scores';
    }
  } else {
    S.ini[S.slot] = ALPHABET[(ALPHABET.indexOf(S.ini[S.slot]) + 1) % ALPHABET.length];
  }
}
// A focused slider owns its own keys: swallowing them here would make the
// controls unusable from the keyboard, which is also the accessible path.
const inControl = e => e.target instanceof Element &&
                       e.target.closest('#tune') !== null;
function syncSnd() {
  const b = document.getElementById('sndbtn');
  b.classList.toggle('off', SND.isMuted());
  b.title = SND.isMuted() ? 'sound off (m)' : 'sound on (m)';
}
document.getElementById('sndbtn').addEventListener('click', e => {
  SND.wake(); SND.setMuted(!SND.isMuted()); syncSnd(); e.currentTarget.blur();
});
document.getElementById('rigbtn').addEventListener('click', e => {
  setRig(!document.body.classList.contains('rig'));
  e.currentTarget.blur();
});
document.getElementById('maxbtn').addEventListener('click', e => {
  setMax(!document.body.classList.contains('max'));
  e.currentTarget.blur();     // or the next Space press would re-trigger it
});
addEventListener('keydown', e => {
  if (inControl(e)) return;
  if (e.code === 'KeyF') { e.preventDefault(); setMax(!document.body.classList.contains('max')); return; }
  if (e.code === 'KeyM') { e.preventDefault(); SND.wake(); SND.setMuted(!SND.isMuted()); syncSnd(); return; }
  if (e.code === 'Escape' && document.body.classList.contains('max')) { setMax(false); return; }
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); press(); }
});
addEventListener('keyup', e => {
  if (inControl(e)) return;
  if (e.code === 'Space' || e.code === 'ArrowUp') release();
});
view.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

// ------------------------------------------------------------------ drawing
function px(a, x, y, c) {
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = ((y | 0) * W + (x | 0)) * 4;
  a[i] = c[0]; a[i + 1] = c[1]; a[i + 2] = c[2]; a[i + 3] = 255;
}
function line(ctx, x0, y0, x1, y1, col) {
  ctx.strokeStyle = col; ctx.beginPath();
  ctx.moveTo(x0 + .5, y0 + .5); ctx.lineTo(x1 + .5, y1 + .5); ctx.stroke();
}
const rgb = c => `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const mixTo = (c, t, f) => [c[0] + (t[0] - c[0]) * f, c[1] + (t[1] - c[1]) * f,
                            c[2] + (t[2] - c[2]) * f];

// Marks scored into the rock on both walls -- never across the passage.
//
// Two reasons for that shape. The rock stays near-black in every region while
// the passage runs from near-dark to blazing, so the rock is the only surface
// on this screen with contrast at every light level: a tick still reads at
// ΗΛΙΟΣ where the passage is almost solid cream. And nothing drawn between the
// walls can be mistaken for the thing that kills you.
function drawMarkers(glow) {
  g.font = '9px ui-monospace,Consolas,monospace';
  g.textAlign = 'center'; g.textBaseline = 'top';
  for (const m of S.targets) {
    const dx = m.at - S.dist;
    if (dx < 0 || dx > W - PLAYER_X - 2) continue;
    const x = Math.round(PLAYER_X + dx);
    const [top, bot] = S.cave.bounds(x);
    const t = top | 0, b = bot | 0;
    const col = m.mine ? '#fff6d6' : rgb(glow);
    line(g, x, Math.max(0, t - MARK_SPAN), x, t - 1, col);
    line(g, x, b + 1, x, Math.min(H - 1, b + MARK_SPAN), col);
    // Your own line is doubled as well as cream: at this size one colour
    // difference is not enough to tell it from a rival at a glance.
    if (m.mine) for (const o of [-2, 2]) {
      line(g, x + o, Math.max(0, t - MARK_SPAN + 2), x + o, t - 1, col);
      line(g, x + o, b + 1, x + o, Math.min(H - 1, b + MARK_SPAN - 2), col);
    }
    g.fillStyle = col;
    if (t - MARK_SPAN - 10 >= 0) g.fillText(m.ini, x, t - MARK_SPAN - 10);
    else if (b + MARK_SPAN + 11 < H) g.fillText(m.ini, x, b + MARK_SPAN + 1);
  }
}

// Whoever is next above you, and how far. This carries the chase most of the
// time: 199 px of forward view is about two seconds, so a target is off-screen
// far more often than on it.
function drawChase() {
  const m = S.targets.find(q => q.at > S.dist);
  if (!m) return;
  g.font = '9px ui-monospace,Consolas,monospace';
  g.textAlign = 'left'; g.textBaseline = 'top';
  const txt = `${m.ini} ${Math.round(m.at - S.dist)}`;
  g.fillStyle = 'rgba(0,0,0,.72)';
  g.fillRect(2, H - 13, g.measureText(txt).width + 5, 12);
  g.fillStyle = m.mine ? '#fff6d6' : '#aaaaaf';
  g.fillText(txt, 4, H - 12);
}

function draw() {
  const reg = regionAt(S.dist);
  let light = reg.light / 255;
  if (reg.label === FLICKER_LABEL) light = clamp(light * flickerAt(S.dist), .02, 1);
  const glow = reg.glow, rock = reg.rock;
  const unlit = [glow[0] * .13, glow[1] * .13, glow[2] * .13];
  const a = img.data;

  // Field: rock, unlit passage, lit passage.
  const stars = reg.label === STARS_LABEL;
  for (let x = 0; x < W; x++) {
    const [top, bot] = S.cave.bounds(x);
    const wc = S.cave.origin + x;
    for (let y = 0; y < H; y++) {
      if (y < top || y > bot) {
        px(a, x, y, stars && isStar(wc, y)
          ? [glow[0] * 1.05 + 40, glow[1] * 1.05 + 40, glow[2] * 1.05 + 40] : rock);
      } else {
        px(a, x, y, BAYER[(y & 7) * 8 + (x & 7)] / 255 < light ? glow : unlit);
      }
    }
  }
  g.putImageData(img, 0, 0);
  g.lineWidth = 1;

  // Rock edge: always drawn, whatever the dither density. It is what keeps the
  // passage legible when the fill alone cannot.
  g.strokeStyle = rgb(glow); g.beginPath();
  for (let x = 0; x < W; x++) {
    const [top, bot] = S.cave.bounds(x);
    g.moveTo(x + .5, (top | 0) + .5); g.lineTo(x + 1.5, (top | 0) + .5);
    g.moveTo(x + .5, (bot | 0) + .5); g.lineTo(x + 1.5, (bot | 0) + .5);
  }
  g.stroke();

  // Before the occlusion, so the closing view swallows the markers too. The
  // descent takes your forward sight away; it should take the marks with it.
  drawMarkers(glow);

  // The closing view, applied after the edge so the edge is occluded too.
  const occ = descentProgress(S.dist);
  if (occ > 0) {
    const e = W * (1 - TUNE.viewClose * occ);
    const grd = g.createLinearGradient(e, 0, W, 0);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, `rgba(0,0,0,${VIEW_DEPTH * occ})`);
    g.fillStyle = grd; g.fillRect(e, 0, W - e, H);
  }

  // Trail: connected segments, and polarity flipped on the region's light --
  // isolated pixels vanish into the dither, and a trail that only brightens is
  // invisible once the passage is near-solid pale.
  const darkOnLight = light >= 0.5;
  const n = Math.max(1, S.trail.length - 1);
  const strand = (f, lead) => rgb(darkOnLight
    ? mixTo(glow, rock, 0.35 + 0.6 * f * lead)
    : mixTo(glow, [255, 255, 255], f * 0.9 * lead));
  for (let i = 1; i < S.trail.length; i++) {
    const p = S.trail[i - 1], q = S.trail[i], f = Math.pow(i / n, 1.6);
    if (!TWIN_TRAIL) { line(g, p[0], p[1], q[0], q[1], strand(f, 1)); continue; }
    const s0 = TRAIL_BASE + (n - i + 1) * TRAIL_SPREAD;
    const s1 = TRAIL_BASE + (n - i) * TRAIL_SPREAD;
    const up = p[2] ? 1 : .35, dn = p[2] ? .35 : 1;
    line(g, p[0], p[1] - s0, q[0], q[1] - s1, strand(f, up));
    line(g, p[0], p[1] + s0, q[0], q[1] + s1, strand(f, dn));
  }

  // Player: bright core in a dark halo, so it reads against black and sun alike.
  g.fillStyle = rgb(rock);
  g.beginPath(); g.arc(PLAYER_X, S.py, 3.2, 0, 7); g.fill();
  g.fillStyle = '#fff'; g.fillRect(PLAYER_X - 1, (S.py | 0) - 1, 3, 3);

  // HUD
  g.font = '10px ui-monospace,Consolas,monospace'; g.textBaseline = 'top';
  g.fillStyle = rgb(glow); g.textAlign = 'right';
  g.fillText(Math.round(S.dist), W - 4, 2);
  g.textAlign = 'center';
  if (S.flashT > 0 && S.banner) {
    g.font = '15px ui-monospace,Consolas,monospace';
    const w = g.measureText(S.banner).width;
    g.fillStyle = rgb(rock); g.fillRect(W / 2 - w / 2 - 5, H / 2 - 12, w + 10, 19);
    g.fillStyle = '#fff6d6'; g.fillText(S.banner, W / 2, H / 2 - 10);
  } else if (S.flashT > 0) {
    const w = g.measureText(reg.name).width;
    g.fillStyle = rgb(rock); g.fillRect(W / 2 - w / 2 - 4, H - 27, w + 8, 15);
    g.fillStyle = rgb(glow); g.fillText(reg.name, W / 2, H - 26);
  } else if (S.captT > 0) {
    // Shares the region slot rather than taking the big centre banner: you can
    // pass nine names in a run, and nine full-screen captions across the flight
    // path would be an obstruction, not an event.
    const w = g.measureText(S.capt).width;
    g.fillStyle = rgb(rock); g.fillRect(W / 2 - w / 2 - 4, H - 27, w + 8, 15);
    g.fillStyle = '#fff6d6'; g.fillText(S.capt, W / 2, H - 26);
  }
  if (S.state === 'play' || S.state === 'ready') drawChase();

  if (S.state === 'title') titleCard();
  else if (S.state === 'ready') readyCard();
  else if (S.state === 'initials') initialsCard();
  else if (S.state === 'scores') scoresCard();
  else if (S.state !== 'play') { if (S.deadT < DEATH_HOLD) impactCard(); else endCard(reg); }
  vx.drawImage(buf, 0, 0, view.width, view.height);
}

function initialsCard() {
  g.fillStyle = 'rgba(0,0,0,.82)'; g.fillRect(0, 0, W, H);
  g.textAlign = 'center';
  g.font = '10px ui-monospace,Consolas,monospace';
  g.fillStyle = '#fff6d6'; g.fillText('ΟΙ ΛΥΘΕΝΤΕΣ', W / 2, 12);
  g.font = '9px ui-monospace,Consolas,monospace';
  g.fillStyle = '#78788a'; g.fillText('YOU ARE ON THE TABLE', W / 2, 28);

  g.font = '22px ui-monospace,Consolas,monospace';
  for (let i = 0; i < 3; i++) {
    const x = W / 2 + (i - 1) * 30;
    const on = i === S.slot;
    g.fillStyle = on ? '#fff6d6' : (i < S.slot ? '#c8c8d2' : '#3a3f4c');
    g.fillText(S.ini[i], x, 48);
    if (on) { g.fillStyle = '#ec7424'; g.fillRect(x - 11, 76, 22, 2); }
  }
  g.font = '9px ui-monospace,Consolas,monospace';
  g.fillStyle = '#8c8c96';
  g.fillText('TAP: NEXT LETTER', W / 2, 92);
  g.fillText('HOLD: CONFIRM', W / 2, 104);
}

function scoresCard() {
  g.fillStyle = 'rgba(0,0,0,.88)'; g.fillRect(0, 0, W, H);
  const table = loadScores();
  g.textAlign = 'center';
  g.font = '10px ui-monospace,Consolas,monospace';
  g.fillStyle = '#fff'; g.fillText('ΟΙ ΛΥΘΕΝΤΕΣ', W / 2, 2);
  g.fillStyle = '#50505c'; g.fillRect(10, 16, W - 20, 1);

  g.font = '10px ui-monospace,Consolas,monospace';
  table.slice(0, TABLE_LEN).forEach((row, i) => {
    const y = 21 + i * 13;
    const justNow = row.mine && Math.round(row.dist) === Math.round(S.dist);
    const won = row.dist >= WIN_DIST;
    const col = justNow ? '#ec7424' : row.mine ? '#f0a460'
              : won ? '#fff6d6' : (i < 3 ? '#d7d7d7' : '#969696');
    g.textAlign = 'left';
    g.fillStyle = justNow ? '#ec7424' : '#69697a';
    g.fillText(justNow ? '>' : String(i + 1), 10, y);
    g.fillStyle = col; g.fillText(row.ini, 26, y);
    g.textAlign = 'right';
    g.fillText(String(Math.round(row.dist)), 120, y);
    g.textAlign = 'left';
    const idx = regionIndex(row.dist);
    g.font = '9px ui-monospace,Consolas,monospace';
    g.fillStyle = won ? '#ffebaa' : '#7d7d86';
    g.fillText((idx >= ASCENT_COUNT ? '↓' : ' ') +
               (won ? 'ΛΕΛΥΤΑΙ' : REGIONS[idx].name), 138, y + 1);
    g.font = '10px ui-monospace,Consolas,monospace';
  });
  g.textAlign = 'center';
  g.font = '9px ui-monospace,Consolas,monospace';
  g.fillStyle = '#6a6a76'; g.fillText('PRESS TO PLAY AGAIN', W / 2, H - 11);
}

function titleCard() {
  // Opaque: the attract screen is its own world, not a veil over a frozen cave.
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  if (bustCanvas) g.drawImage(bustCanvas, 6, (H - BUST_H) >> 1);

  const x = 6 + BUST_W + 12;
  g.textAlign = 'left'; g.textBaseline = 'top';
  g.font = '10px ui-monospace,Consolas,monospace'; g.fillStyle = '#fff';
  g.fillText('CAN YOU ESCAPE', x, H * 0.24);
  g.fillText("PLATO'S CAVE?", x, H * 0.24 + 14);
  line(g, x, Math.round(H * 0.62), W - 9, Math.round(H * 0.62), '#5a5a5a');

  g.font = '9px ui-monospace,Consolas,monospace';
  const best = loadMyBest();
  if (best) { g.fillStyle = '#6a7080'; g.fillText('BEST ' + best, x, H * 0.68); }
  // Blink, as an attract screen should. 800 on, 400 off.
  if (performance.now() % 1200 < 800) {
    g.fillStyle = '#bebebe';
    g.fillText('[ PRESS ]', x, H * 0.68 + (best ? 13 : 0));
  }
}

function readyCard() {
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, 0, W, H);
  g.textAlign = 'center';
  g.font = '13px ui-monospace,Consolas,monospace';
  g.fillStyle = '#fff6d6'; g.fillText('ΣΚΙΑΙ', W / 2, H / 2 - 20);
  g.font = '9px ui-monospace,Consolas,monospace';
  g.fillStyle = '#78788a'; g.fillText('SHADOWS ON THE WALL', W / 2, H / 2 - 2);
  g.font = '10px ui-monospace,Consolas,monospace';
  g.fillStyle = '#c8c8d2'; g.fillText('HOLD TO CLIMB', W / 2, H / 2 + 18);
}

// Two deaths, not one. Climbing, you are still a prisoner; returning, your eyes
// are full of darkness (Republic 516e). Shared by both end screens so the word
// cannot drift between them.
function deathWord() {
  if (S.state === 'won') return ['ΚΑΤΕΒΗΝ', 'I WENT DOWN', '#eeeef5'];
  return S.dist >= DESCENT_START ? ['ΤΥΦΛΟΣ', 'BLIND', '#c4cae2']
                                 : ['ΔΕΣΜΩΤΗΣ', 'PRISONER', '#e87424'];
}

// The word over the frame you died on, not over a black screen. It does two
// jobs at once: the beat, and the reason. A death whose cause you can see reads
// as your own fault, and that is the precondition for pressing again.
function impactCard() {
  const [word, gloss, hue] = deathWord();
  g.fillStyle = 'rgba(0,0,0,.58)'; g.fillRect(0, 0, W, H);

  if (S.state !== 'won') {
    g.strokeStyle = '#fff';
    for (const r of [7, 8]) {
      g.beginPath(); g.arc(PLAYER_X, S.hitY, r, 0, 7); g.stroke();
    }
    line(g, PLAYER_X - 13, S.hitY, PLAYER_X - 9, S.hitY, '#fff');
    line(g, PLAYER_X + 9, S.hitY, PLAYER_X + 13, S.hitY, '#fff');
  }

  // The band goes in the half the body is not in. Centred, it covers the ring
  // it exists to reveal -- which is what the first version did.
  const y = (S.state === 'won' || S.hitY < H / 2) ? H - 38 : 5;
  g.fillStyle = '#000'; g.fillRect(0, y - 4, W, 38);
  g.textAlign = 'center'; g.textBaseline = 'top';
  g.font = '20px ui-monospace,Consolas,monospace';
  g.fillStyle = hue; g.fillText(word, W / 2, y);
  g.font = '9px ui-monospace,Consolas,monospace';
  g.fillStyle = '#78788a'; g.fillText(gloss, W / 2, y + 24);
}

function endCard(reg) {
  const won = S.state === 'won';
  const [word, gloss, hue] = deathWord();
  g.fillStyle = 'rgba(0,0,0,.72)'; g.fillRect(0, 0, W, H);
  g.textAlign = 'center';
  g.font = '20px ui-monospace,Consolas,monospace';
  g.fillStyle = hue; g.fillText(word, W / 2, 22);
  g.font = '9px ui-monospace,Consolas,monospace';
  g.fillStyle = '#78788a'; g.fillText(gloss, W / 2, 46);

  // Pips: one per region in its own light, filled to where the run ended.
  const idx = regionIndex(S.dist), pip = 7, gap = 3, turn = 7;
  const width = REGIONS.length * (pip + gap) - gap + turn;
  let x = W / 2 - width / 2;
  REGIONS.forEach((r, i) => {
    if (i === ASCENT_COUNT) x += turn;
    g.fillStyle = i <= idx ? rgb(r.glow)
      : rgb([r.glow[0] * .16, r.glow[1] * .16, r.glow[2] * .16]);
    g.fillRect(x, 62, pip, pip); x += pip + gap;
  });
  g.fillStyle = '#fff6d6';
  g.fillRect(W / 2 - width / 2 + ASCENT_COUNT * (pip + gap) + turn / 2 - 1, 60, 1, 11);

  g.font = '10px ui-monospace,Consolas,monospace';
  g.fillStyle = '#e2e2e2';
  const r = REGIONS[idx];
  g.fillText(`${idx >= ASCENT_COUNT ? '↓' : ''}${won ? 'ΛΕΛΥΤΑΙ' : r.name}   ${idx + 1}/${REGIONS.length}`,
             W / 2, 80);
  g.fillStyle = '#8c8c96';
  const mm = Math.floor(S.t / 60), ss = Math.floor(S.t % 60);
  g.fillText(`${mm}:${String(ss).padStart(2, '0')}    ${Math.round(S.dist)}`, W / 2, 94);
  g.fillStyle = '#6a6a76'; g.font = '9px ui-monospace,Consolas,monospace';
  g.fillText(S.pending ? 'PRESS TO ENTER YOUR NAME' : 'PRESS TO TRY AGAIN',
             W / 2, 112);
}


// ------------------------------------------------------------------- audio
// Republic 398e-399c: Socrates throws out the lamenting harmoniai and the slack
// ones, and keeps exactly two -- one for a man in violent action, one for a man
// acting peacefully, by persuasion. Glaucon names them Dorian and Phrygian.
//
// So: the ascent is the forced climb and takes the Dorian. The return is the
// freed prisoner going back down to persuade the people still chained, which is
// precisely Phrygian's remit, and it takes that.
//
// The trap: the modern church modes called Dorian and Phrygian are not the
// ancient harmoniai of those names -- as the later theorists transmit the octave
// species, ancient Dorian is the modern Phrygian and ancient Phrygian is the
// modern Dorian. They are swapped. These are the ancient ones, so naming the
// ascent "Dorian" is a claim about Plato's word and not about a jazz chart.
// (The reconstruction is not beyond dispute; this follows the octave-species
// account rather than pretending the question is settled.)
const DORIAN   = [0, 1, 3, 5, 7, 8, 10];   // ancient: E-octave species
const PHRYGIAN = [0, 2, 3, 5, 7, 9, 10];   // ancient: D-octave species
const SND_BASE = 45;                        // MIDI A2, low enough to stay under the game

const SND = (() => {
  let ctx = null, master = null;
  let muted = false;
  try { muted = !!localStorage.getItem('pc_mute'); } catch (e) { /* private mode */ }
  let thrusting = null;                     // the held-thrust voice, if any
  const recent = [];                        // what fired, for the tests

  const Ctor = typeof AudioContext !== 'undefined' ? AudioContext
             : typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null;

  // Browsers refuse to start audio without a gesture, so the context is built on
  // the first press -- which is the title screen's press, exactly where an
  // arcade cabinet would come alive anyway.
  function wake() {
    if (!Ctor || ctx) return;
    ctx = new Ctor();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.22;
    master.connect(ctx.destination);
  }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const deg = (mode, n) => {
    // Degrees past the seventh keep climbing, an octave at a time.
    const oct = Math.floor(n / mode.length), i = n - oct * mode.length;
    return mode[i] + 12 * oct;
  };

  function tone(o) {
    if (!ctx || muted) return null;
    const t0 = ctx.currentTime + (o.at || 0);
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = o.type || 'triangle';
    osc.frequency.setValueAtTime(hz(o.note), t0);
    if (o.slide !== undefined) osc.frequency.exponentialRampToValueAtTime(hz(o.slide), t0 + o.dur);
    // Never a bare start/stop: a square edge on the envelope is a click, and at
    // this volume the click is louder than the note.
    const peak = (o.gain === undefined ? 0.5 : o.gain);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + (o.attack || 0.012));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + o.dur + 0.02);
    return osc;
  }

  // One region per scale degree, so the seven-region ascent is exactly one
  // octave of the Dorian species and the return walks the Phrygian back down.
  function rootFor(i) {
    return i < ASCENT_COUNT
      ? SND_BASE + deg(DORIAN, i)
      : SND_BASE + deg(PHRYGIAN, REGIONS.length - 1 - i);
  }

  function cue(name, arg) {
    recent.push(name); if (recent.length > 24) recent.shift();
    if (!ctx || muted) return;
    const mode = (arg | 0) < ASCENT_COUNT ? DORIAN : PHRYGIAN;
    const root = rootFor(arg | 0);
    switch (name) {
      case 'region':
        // A triad off the region's own root: the palette shifts, so does this.
        [0, 2, 4].forEach((d, k) =>
          tone({ note: root + deg(mode, d), dur: 0.5, at: k * 0.07, gain: 0.35 }));
        break;
      case 'turn':
        // The hinge, and audibly so: the top of the Dorian, then the Phrygian
        // answering underneath it. The one moment both modes are heard.
        [6, 4, 2].forEach((d, k) =>
          tone({ note: SND_BASE + deg(DORIAN, d), dur: 0.4, at: k * 0.10, gain: 0.4 }));
        [0, 2, 4].forEach((d, k) =>
          tone({ note: SND_BASE + deg(PHRYGIAN, d), dur: 0.9, at: 0.34 + k * 0.10, gain: 0.4 }));
        break;
      case 'pass':
        tone({ note: root + 12, dur: 0.14, type: 'square', gain: 0.12 });
        break;
      case 'death':
        // Falling, and dull. The returning death drops further: its word is
        // TYPHLOS and the screen is going dark as it plays.
        tone({ note: root, slide: root - (arg >= ASCENT_COUNT ? 19 : 12),
               dur: 0.9, type: 'sawtooth', gain: 0.3 });
        break;
      case 'win':
        [0, 2, 4, 7].forEach((d, k) =>
          tone({ note: SND_BASE + deg(PHRYGIAN, d), dur: 1.6, at: k * 0.13, gain: 0.32 }));
        break;
    }
  }

  function thrust(on, region) {
    recent.push(on ? 'thrust+' : 'thrust-');
    if (recent.length > 24) recent.shift();
    if (!ctx || muted) { thrusting = null; return; }
    if (on && !thrusting) {
      // Quiet and low: this runs for most of a five-minute run, so it has to sit
      // under everything else or it becomes the only thing you hear.
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = hz(rootFor(region | 0) - 12);
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.09, ctx.currentTime + 0.05);
      osc.connect(g); g.connect(master); osc.start();
      thrusting = { osc, g };
    } else if (!on && thrusting) {
      const { osc, g } = thrusting; thrusting = null;
      g.gain.cancelScheduledValues(ctx.currentTime);
      g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.08);
      osc.stop(ctx.currentTime + 0.1);
    }
  }

  function setMuted(on) {
    muted = on;
    try { localStorage.setItem('pc_mute', on ? '1' : ''); } catch (e) { /* private mode */ }
    if (on) thrust(false, 0);
    if (master) master.gain.value = on ? 0 : 0.22;
  }
  return { wake, cue, thrust, setMuted, isMuted: () => muted, recent,
           available: () => !!Ctor };
})();

// ---------------------------------------------------------------- main loop
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, DT_CLAMP); last = now;
  if (S.state === 'ready') {
    // Hold at the middle of the passage, world frozen, until the first press.
    const [t0, b0] = S.cave.bounds(PLAYER_X);
    S.py = (t0 + b0) / 2; S.vy = 0;
  }
  if (S.state === 'dead' || S.state === 'won') S.deadT += dt;
  if (S.state === 'play') {
    // Armed on the first playing frame, not at reset: a region jump moves dist
    // afterwards, and without this every target below the jump would announce
    // itself as passed on the way in.
    if (!S.armed) { S.targets.forEach(m => { m.done = S.dist >= m.at; }); S.armed = true; }
    S.t += dt;
    S.vy += (held ? TUNE.thrust : TUNE.gravity) * H * dt;
    S.vy = clamp(S.vy, -TUNE.vyMax * H, TUNE.vyMax * H);
    S.py += S.vy * dt;

    const adv = speedAt(S.dist) * dt;
    const before = S.dist; S.dist += adv; S.acc += adv;
    let cols = 0;
    while (S.acc >= 1) { S.cave.step(S.dist); S.acc -= 1; cols++; }

    if (before < DESCENT_START && S.dist >= DESCENT_START) {
      S.banner = 'ΠΕΡΙΑΓΩΓΗ'; S.flashT = 1.6; SND.cue('turn', regionIndex(S.dist));
    } else if (regionAt(before) !== regionAt(S.dist)) {
      S.banner = null; S.flashT = 0.5; SND.cue('region', regionIndex(S.dist));
    } else if (S.flashT > 0) {
      S.flashT -= dt; if (S.flashT <= 0) S.banner = null;
    }

    // ΠΑΡΗΛΘΕΣ -- "you have passed". A formation for this project, like
    // ΟΙ ΛΥΘΕΝΤΕΣ, not a quotation from the text. Practice runs stay silent:
    // starting at 31300 would announce eight overtakes you did not make.
    let passed = null;
    for (const m of S.targets) if (!m.done && S.dist >= m.at) { m.done = true; passed = m; }
    if (passed && !S.practice) { S.capt = 'ΠΑΡΗΛΘΕΣ'; S.captT = 1.0;
                                 SND.cue('pass', regionIndex(S.dist)); }
    else if (S.captT > 0) S.captT -= dt;

    if (held !== S.wasHeld) { SND.thrust(held, regionIndex(S.dist)); S.wasHeld = held; }

    S.trail = S.trail.map(p => [p[0] - cols, p[1], p[2]]).filter(p => p[0] >= 0);
    S.trail.push([PLAYER_X, S.py | 0, held]);
    if (S.trail.length > TRAIL_LEN) S.trail.shift();

    const [top, bot] = S.cave.bounds(PLAYER_X);
    const over = S.py < top || S.py > bot;
    if (over || S.dist >= WIN_DIST) {
      S.state = over ? 'dead' : 'won';
      // Not clamped onto the panel. The ring's whole job is to say *here*, and
      // a clamped ring says it about somewhere you did not hit. Death happens
      // within one frame of leaving the passage -- at most ~7 px past a wall
      // that WALL_MARGIN keeps ~8 px inside the panel -- so the true point is
      // essentially always visible, and clipping beats lying when it is not.
      S.hitY = S.py; S.deadT = 0;
      SND.thrust(false, 0); S.wasHeld = false;
      SND.cue(over ? 'death' : 'win', regionIndex(S.dist));
      // Every run counts toward your own best, whether or not it makes the
      // table -- otherwise early progress is invisible until you beat ΘΡΑ.
      // Except practice runs, which started partway up and did not earn it.
      if (!S.practice) {
        noteRun(S.dist);
        S.pending = qualifies(S.dist); // a win always qualifies; it is the max
      } else {
        S.pending = false;
      }
    }
  }
  draw();
  hud();
  requestAnimationFrame(frame);
}

let fpsN = 0, fpsShown = 0, fpsT0 = 0;
const hudEl = document.getElementById('hud');
function hud() {
  if (++fpsN > 30) {
    fpsShown = Math.round(fpsN / (performance.now() - fpsT0) * 1000);
    fpsN = 0; fpsT0 = performance.now();
  }
  const i = regionIndex(S.dist), r = REGIONS[i];
  const mm = Math.floor(S.t / 60), ss = Math.floor(S.t % 60);
  // Measured against the best you have actually managed, not the current run,
  // so the target holds still while you are flying.
  const nextUp = nextAbove(loadMyBest());
  // The seed is always shown, not just when pinned: a run that felt worth
  // repeating is worth being able to repeat.
  const seedCell = URL_SEED === null
    ? `<a href="#seed=${S.seed}" title="pin this cave and reload">seed ${S.seed}</a>`
    : `<a href="#" class=pinned title="back to random caves">seed <b>${S.seed}</b> pinned</a>`;
  hudEl.innerHTML =
    `<span><kbd>space</kbd> / tap to thrust</span>` +
    `<span class=live>${i >= ASCENT_COUNT ? '↓' : ''}${r.name} <b>${i + 1}</b>/${REGIONS.length}</span>` +
    `<span>${mm}:${String(ss).padStart(2, '0')}</span>` +
    `<span>your best <b>${loadMyBest() || '—'}</b></span>` +
    (nextUp ? `<span>next <b>${nextUp.ini}</b> ${Math.round(nextUp.dist)}</span>` : '') +
    `<span>${seedCell}</span>` +
    `<span>${fpsShown} fps</span>`;
}
// Changing the hash does not reload on its own, and the seed is read once.
addEventListener('hashchange', () => location.reload());

// Live controls for the four constants the hardware cannot yet settle. These
// are the point of the page: find a number by feel, then report it and it gets
// baked into cave.py, which every other build derives from.
const KNOBS = [
  ['gravity',   'gravity',   3, 12,   0.1],
  ['thrust',    'thrust',  -16, -4,   0.1],
  ['vyMax',     'vy max',  0.6, 2.4, 0.02],
  ['viewClose', 'view close', 0, 0.8, 0.01],
];
const tuneEl = document.getElementById('tune');
tuneEl.innerHTML = KNOBS.map(([key, label, lo, hi, step]) =>
  `<label><i>${label}</i>` +
  `<input type=range id="k_${key}" min="${lo}" max="${hi}" step="${step}">` +
  `<output id="o_${key}"></output></label>`).join('') +
  `<button id=k_reset title="back to the values baked from cave.py">reset</button>` +
  `<label id=jump><i>start at</i><span id=jumprow></span></label>`;

// Region jump. A tuning build has to let you reach the thing being tuned: at a
// realistic standard the return is four minutes of flawless play away, which is
// no way to judge it. Practice runs are excluded from the table and from your
// best, or starting at 31300 would "win" instantly and poison both.
const jumpRow = document.getElementById('jumprow');
jumpRow.innerHTML = REGIONS.map((r, i) =>
  `<button class=pip data-i="${i}" title="${r.name} — ${r.from}"` +
  ` style="background:rgb(${r.glow})"></button>` +
  (i === ASCENT_COUNT - 1 ? '<span class=turn></span>' : '')).join('');
jumpRow.addEventListener('click', e => {
  const b = e.target.closest('.pip');
  if (!b) return;
  const r = REGIONS[+b.dataset.i];
  reset();
  S.dist = r.from + 1;
  S.practice = +b.dataset.i > 0;
  // Refill the column buffer at this distance, or the first screen would still
  // be carrying the opening gap.
  for (let i = 0; i < W; i++) S.cave.step(S.dist);
  const [t, bt] = S.cave.bounds(PLAYER_X);
  S.py = (t + bt) / 2;
  b.blur();
});

function hashState() {
  const q = {};
  (location.hash.slice(1) + '&' + location.search.slice(1)).split('&')
    .forEach(p => { const [k, v] = p.split('='); if (k) q[k] = v; });
  return q;
}
function applyHashTune() {
  const q = hashState();
  const map = { g: 'gravity', t: 'thrust', v: 'vyMax', vc: 'viewClose' };
  let any = false;
  for (const [short, key] of Object.entries(map)) {
    if (q[short] !== undefined && !Number.isNaN(+q[short])) { TUNE[key] = +q[short]; any = true; }
  }
  // A link that pins a tuning is someone being shown a number. Hiding the
  // sliders it arrived to demonstrate would make the link useless.
  return any;
}
function writeHash() {
  const bits = [];
  if (URL_SEED !== null) bits.push(`seed=${URL_SEED}`);
  const map = { g: 'gravity', t: 'thrust', v: 'vyMax', vc: 'viewClose' };
  for (const [short, key] of Object.entries(map)) {
    if (TUNE[key] !== BAKED[key]) bits.push(`${short}=${TUNE[key]}`);
  }
  // replaceState, not location.hash: assigning the hash fires hashchange, and
  // hashchange reloads the page -- which would restart the run on every drag.
  history.replaceState(null, '', bits.length ? '#' + bits.join('&') : location.pathname);
}
function syncKnobs() {
  for (const [key] of KNOBS) {
    document.getElementById('k_' + key).value = TUNE[key];
    const o = document.getElementById('o_' + key);
    o.textContent = (+TUNE[key]).toFixed(key === 'viewClose' || key === 'vyMax' ? 2 : 1);
    o.classList.toggle('changed', TUNE[key] !== BAKED[key]);
  }
}
syncSnd();
const pinnedTune = applyHashTune();
setRig(pinnedTune || !!localStorage.getItem('pc_rig'));
syncKnobs();
for (const [key] of KNOBS) {
  document.getElementById('k_' + key).addEventListener('input', e => {
    TUNE[key] = +e.target.value; syncKnobs(); writeHash();
  });
}
document.getElementById('k_reset').addEventListener('click', () => {
  Object.assign(TUNE, BAKED); syncKnobs(); writeHash();
  document.getElementById('k_reset').blur();
});

if (localStorage.getItem('pc_max')) document.body.classList.add('max');
fitCanvas(); reset(); S.state = 'title'; fpsT0 = performance.now(); requestAnimationFrame(frame);
</script>
