<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Plato's Cave</title>
<style>
  /* Committed to one visual world: a dithered phosphor display. A light ground
     would wash the dither out, so there is no light theme by choice. Every
     colour here is lifted from the game's own palette. */
  :root{
    --ground:#07080b; --panel:#0d0f15; --rule:#1b1f28;
    --dim:#6a7080; --text:#aeb4c2; --sun:#fff6d6; --fire:#ec7424;
    --gap:clamp(10px,2.2vh,20px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ground);color:var(--text);
    font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:var(--gap);padding:var(--gap);overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:manipulation}

  header{display:flex;flex-direction:column;align-items:center;gap:4px}
  h1{margin:0;font-size:12px;font-weight:600;letter-spacing:.34em;
    text-indent:.34em;color:var(--sun);text-transform:uppercase}
  .sub{margin:0;font-size:11px;color:var(--dim);letter-spacing:.05em}

  canvas{image-rendering:pixelated;image-rendering:crisp-edges;
    display:block;border:1px solid var(--rule);
    max-width:100%;box-shadow:0 0 0 1px #000,0 18px 50px -20px #000}

  #hud{display:flex;flex-wrap:wrap;justify-content:center;
    gap:6px 18px;font-size:12px;color:var(--dim);
    font-variant-numeric:tabular-nums}
  #hud b{color:var(--text);font-weight:600}
  #hud .live{color:var(--fire)}

  /* The constants actually under test. This is a tuning rig, so "it feels
     floaty" is only useful next to the number that makes it so. */
  #tune{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 14px;
    padding-top:calc(var(--gap) * .6);border-top:1px solid var(--rule);
    font-size:11px;color:#4e5462;font-variant-numeric:tabular-nums;
    max-width:640px;text-align:center}
  #tune span{white-space:nowrap}
  #tune i{font-style:normal;color:var(--dim)}

  kbd{background:var(--panel);border:1px solid var(--rule);border-radius:3px;
    padding:1px 6px;color:var(--text);font:inherit;font-size:11px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <h1>Plato&rsquo;s Cave</h1>
  <p class=sub>tuning build &middot; 240&times;135 &middot; win at 33000</p>
</header>
<canvas id=c></canvas>
<div id=hud></div>
<div id=tune></div>
<script>
// ---- BEGIN GENERATED by tools/bake_web.py -- do not edit by hand ----
const W=240,H=135;
const REGIONS=[
  {name:"ΣΚΙΑΙ",label:"ΣΚΙΑΙ",from:0,light:36,rock:[6,7,11],glow:[78,88,104]},  //  0 ascent
  {name:"ΠΥΡ",label:"ΠΥΡ",from:700,light:61,rock:[15,7,4],glow:[236,116,36]},  //  1 ascent
  {name:"ΕΙΔΩΛΑ",label:"ΕΙΔΩΛΑ",from:1800,light:92,rock:[17,11,4],glow:[248,180,74]},  //  2 ascent
  {name:"ΥΔΩΡ",label:"ΥΔΩΡ",from:3400,light:128,rock:[4,13,17],glow:[84,198,222]},  //  3 ascent
  {name:"ΑΣΤΡΑ",label:"ΑΣΤΡΑ",from:6000,light:163,rock:[7,6,18],glow:[152,150,242]},  //  4 ascent
  {name:"ΣΕΛΗΝΗ",label:"ΣΕΛΗΝΗ",from:9900,light:204,rock:[11,13,19],glow:[206,224,255]},  //  5 ascent
  {name:"ΗΛΙΟΣ",label:"ΗΛΙΟΣ",from:16000,light:255,rock:[20,15,6],glow:[255,246,214]},  //  6 ascent
  {name:"ΣΕΛΗΝΗ",label:"ΣΕΛΗΝΗ",from:19000,light:147,rock:[11,13,19],glow:[206,224,255]},  //  7 return
  {name:"ΑΣΤΡΑ",label:"ΑΣΤΡΑ",from:22200,light:108,rock:[7,6,18],glow:[152,150,242]},  //  8 return
  {name:"ΥΔΩΡ",label:"ΥΔΩΡ",from:25000,light:76,rock:[4,13,17],glow:[84,198,222]},  //  9 return
  {name:"ΕΙΔΩΛΑ",label:"ΕΙΔΩΛΑ",from:27400,light:50,rock:[17,11,4],glow:[248,180,74]},  // 10 return
  {name:"ΠΥΡ",label:"ΠΥΡ",from:29500,light:29,rock:[15,7,4],glow:[236,116,36]},  // 11 return
  {name:"ΣΚΙΑΙ",label:"ΣΚΙΑΙ",from:31300,light:15,rock:[6,7,11],glow:[78,88,104]},  // 12 return
];
const SPEED_START=55.0,SPEED_END=100.0,SPEED_RAMP_END=16000,SPEED_DESC_END=145.0;
const GAP_START=0.48,GAP_MIN=0.21,GAP_RAMP_END=12000,GAP_DESC_MIN=0.15;
const DESCENT_START=19000,WIN_DIST=33000;
const GRAVITY=7.8,THRUST=-9.6,VY_MAX=1.26;
const DRIFT_STEP=0.42,DRIFT_CLAMP=2.6,DRIFT_DAMP=0.94;
const WALL_MARGIN=0.06,PLAYER_X_FRAC=0.17;
const TWIN_TRAIL=1,TRAIL_BASE=1.4,TRAIL_SPREAD=0.1,TRAIL_LEN=40;
const VIEW_CLOSE=0.55,VIEW_DEPTH=0.92;
const FLICKER_LABEL="ΠΥΡ",FLICKER_DEPTH=0.16,STARS_LABEL="ΑΣΤΡΑ",STAR_RARITY=1400;
const ASCENT_COUNT=7;
const BAYER=[0,128,32,159,8,135,40,167,191,64,223,96,199,72,231,104,48,175,16,143,56,183,24,151,239,112,207,80,247,120,215,88,12,139,44,171,4,131,36,163,203,76,235,108,195,68,227,100,60,187,28,155,52,179,20,147,251,124,219,92,243,116,211,84];
// ---- END GENERATED ----

const PLAYER_X = Math.max(8, Math.round(W * PLAYER_X_FRAC));
const DT_CLAMP = 0.05;          // one slow frame must not teleport the player

// ---------------------------------------------------------------- rendering
const view = document.getElementById('c');
const vx = view.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const g = buf.getContext('2d');
const img = g.createImageData(W, H);

function fitCanvas() {
  const z = Math.max(1, Math.min(Math.floor(innerWidth * 0.96 / W),
                                 Math.floor(innerHeight * 0.74 / H)));
  view.width = W * z; view.height = H * z;
  vx.imageSmoothingEnabled = false;
}
addEventListener('resize', fitCanvas);

// --------------------------------------------------------------- game model
function rng(seed) {                       // mulberry32
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function descentProgress(d) {
  return d <= DESCENT_START ? 0
    : Math.min(1, (d - DESCENT_START) / (WIN_DIST - DESCENT_START));
}
function speedAt(d) {
  return d <= SPEED_RAMP_END
    ? SPEED_START + (SPEED_END - SPEED_START) * (d / SPEED_RAMP_END)
    : SPEED_END + (SPEED_DESC_END - SPEED_END) * descentProgress(d);
}
function gapAt(d) {
  const t = Math.min(1, d / GAP_RAMP_END);
  return H * (GAP_START - (GAP_START - GAP_MIN) * t
              - (GAP_MIN - GAP_DESC_MIN) * descentProgress(d));
}
function regionAt(d) {
  let r = REGIONS[0];
  for (const c of REGIONS) if (d >= c.from) r = c;
  return r;
}
function regionIndex(d) {
  let i = 0;
  REGIONS.forEach((c, n) => { if (d >= c.from) i = n; });
  return i;
}
function flickerAt(d) {
  return 1 + FLICKER_DEPTH * 0.62 * Math.sin(d * 0.091)
           + FLICKER_DEPTH * 0.38 * Math.sin(d * 0.237 + 1.7);
}
function isStar(wc, y) {
  const h = (Math.imul(wc, 73856093) ^ Math.imul(y, 19349663)) & 0x7fffffff;
  return h % STAR_RARITY === 0;
}

class Cave {
  constructor(seed) {
    this.r = rng(seed);
    this.centre = H / 2; this.gap = gapAt(0); this.drift = 0; this.origin = 0;
    this.cols = new Array(W).fill(0).map(() => [this.centre, this.gap]);
  }
  step(dist) {
    this.drift += (this.r() * 2 - 1) * DRIFT_STEP;
    this.drift = clamp(this.drift, -DRIFT_CLAMP, DRIFT_CLAMP) * DRIFT_DAMP;
    this.centre += this.drift;
    this.gap = gapAt(dist);
    const m = this.gap / 2 + H * WALL_MARGIN;
    if (this.centre < m) { this.centre = m; this.drift = Math.abs(this.drift); }
    if (this.centre > H - m) { this.centre = H - m; this.drift = -Math.abs(this.drift); }
    this.cols.shift(); this.cols.push([this.centre, this.gap]); this.origin++;
  }
  bounds(x) { const [c, gp] = this.cols[x]; return [c - gp / 2, c + gp / 2]; }
}

// ------------------------------------------------------------- game session
let S = null;
function reset(seed) {
  S = { cave: new Cave(seed || (Math.random() * 1e9 | 0)),
        py: H / 2, vy: 0, dist: 0, acc: 0, trail: [],
        banner: null, flashT: 0, t: 0, state: 'play', best: loadBest() };
}
function loadBest() { return +(localStorage.getItem('pc_best') || 0); }
function saveBest(d) {
  if (d > loadBest()) localStorage.setItem('pc_best', Math.round(d));
}

let held = false;
function press() {
  if (!S || S.state !== 'play') { reset(); return; }
  held = true;
}
function release() { held = false; }
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); press(); }
});
addEventListener('keyup', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') release();
});
view.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

// ------------------------------------------------------------------ drawing
function px(a, x, y, c) {
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = ((y | 0) * W + (x | 0)) * 4;
  a[i] = c[0]; a[i + 1] = c[1]; a[i + 2] = c[2]; a[i + 3] = 255;
}
function line(ctx, x0, y0, x1, y1, col) {
  ctx.strokeStyle = col; ctx.beginPath();
  ctx.moveTo(x0 + .5, y0 + .5); ctx.lineTo(x1 + .5, y1 + .5); ctx.stroke();
}
const rgb = c => `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const mixTo = (c, t, f) => [c[0] + (t[0] - c[0]) * f, c[1] + (t[1] - c[1]) * f,
                            c[2] + (t[2] - c[2]) * f];

function draw() {
  const reg = regionAt(S.dist);
  let light = reg.light / 255;
  if (reg.label === FLICKER_LABEL) light = clamp(light * flickerAt(S.dist), .02, 1);
  const glow = reg.glow, rock = reg.rock;
  const unlit = [glow[0] * .13, glow[1] * .13, glow[2] * .13];
  const a = img.data;

  // Field: rock, unlit passage, lit passage.
  const stars = reg.label === STARS_LABEL;
  for (let x = 0; x < W; x++) {
    const [top, bot] = S.cave.bounds(x);
    const wc = S.cave.origin + x;
    for (let y = 0; y < H; y++) {
      if (y < top || y > bot) {
        px(a, x, y, stars && isStar(wc, y)
          ? [glow[0] * 1.05 + 40, glow[1] * 1.05 + 40, glow[2] * 1.05 + 40] : rock);
      } else {
        px(a, x, y, BAYER[(y & 7) * 8 + (x & 7)] / 255 < light ? glow : unlit);
      }
    }
  }
  g.putImageData(img, 0, 0);
  g.lineWidth = 1;

  // Rock edge: always drawn, whatever the dither density. It is what keeps the
  // passage legible when the fill alone cannot.
  g.strokeStyle = rgb(glow); g.beginPath();
  for (let x = 0; x < W; x++) {
    const [top, bot] = S.cave.bounds(x);
    g.moveTo(x + .5, (top | 0) + .5); g.lineTo(x + 1.5, (top | 0) + .5);
    g.moveTo(x + .5, (bot | 0) + .5); g.lineTo(x + 1.5, (bot | 0) + .5);
  }
  g.stroke();

  // The closing view, applied after the edge so the edge is occluded too.
  const occ = descentProgress(S.dist);
  if (occ > 0) {
    const e = W * (1 - VIEW_CLOSE * occ);
    const grd = g.createLinearGradient(e, 0, W, 0);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, `rgba(0,0,0,${VIEW_DEPTH * occ})`);
    g.fillStyle = grd; g.fillRect(e, 0, W - e, H);
  }

  // Trail: connected segments, and polarity flipped on the region's light --
  // isolated pixels vanish into the dither, and a trail that only brightens is
  // invisible once the passage is near-solid pale.
  const darkOnLight = light >= 0.5;
  const n = Math.max(1, S.trail.length - 1);
  const strand = (f, lead) => rgb(darkOnLight
    ? mixTo(glow, rock, 0.35 + 0.6 * f * lead)
    : mixTo(glow, [255, 255, 255], f * 0.9 * lead));
  for (let i = 1; i < S.trail.length; i++) {
    const p = S.trail[i - 1], q = S.trail[i], f = Math.pow(i / n, 1.6);
    if (!TWIN_TRAIL) { line(g, p[0], p[1], q[0], q[1], strand(f, 1)); continue; }
    const s0 = TRAIL_BASE + (n - i + 1) * TRAIL_SPREAD;
    const s1 = TRAIL_BASE + (n - i) * TRAIL_SPREAD;
    const up = p[2] ? 1 : .35, dn = p[2] ? .35 : 1;
    line(g, p[0], p[1] - s0, q[0], q[1] - s1, strand(f, up));
    line(g, p[0], p[1] + s0, q[0], q[1] + s1, strand(f, dn));
  }

  // Player: bright core in a dark halo, so it reads against black and sun alike.
  g.fillStyle = rgb(rock);
  g.beginPath(); g.arc(PLAYER_X, S.py, 3.2, 0, 7); g.fill();
  g.fillStyle = '#fff'; g.fillRect(PLAYER_X - 1, (S.py | 0) - 1, 3, 3);

  // HUD
  g.font = '10px ui-monospace,Consolas,monospace'; g.textBaseline = 'top';
  g.fillStyle = rgb(glow); g.textAlign = 'right';
  g.fillText(Math.round(S.dist), W - 4, 2);
  g.textAlign = 'center';
  if (S.flashT > 0 && S.banner) {
    g.font = '15px ui-monospace,Consolas,monospace';
    const w = g.measureText(S.banner).width;
    g.fillStyle = rgb(rock); g.fillRect(W / 2 - w / 2 - 5, H / 2 - 12, w + 10, 19);
    g.fillStyle = '#fff6d6'; g.fillText(S.banner, W / 2, H / 2 - 10);
  } else if (S.flashT > 0) {
    const w = g.measureText(reg.name).width;
    g.fillStyle = rgb(rock); g.fillRect(W / 2 - w / 2 - 4, H - 27, w + 8, 15);
    g.fillStyle = rgb(glow); g.fillText(reg.name, W / 2, H - 26);
  }

  if (S.state !== 'play') endCard(reg);
  vx.drawImage(buf, 0, 0, view.width, view.height);
}

function endCard(reg) {
  const won = S.state === 'won';
  const word = won ? 'ΚΑΤΕΒΗΝ' : (S.dist >= DESCENT_START ? 'ΤΥΦΛΟΣ' : 'ΔΕΣΜΩΤΗΣ');
  const gloss = won ? 'I WENT DOWN' : (S.dist >= DESCENT_START ? 'BLIND' : 'PRISONER');
  const hue = won ? '#eeeef5' : (S.dist >= DESCENT_START ? '#c4cae2' : '#e87424');
  g.fillStyle = 'rgba(0,0,0,.72)'; g.fillRect(0, 0, W, H);
  g.textAlign = 'center';
  g.font = '20px ui-monospace,Consolas,monospace';
  g.fillStyle = hue; g.fillText(word, W / 2, 22);
  g.font = '9px ui-monospace,Consolas,monospace';
  g.fillStyle = '#78788a'; g.fillText(gloss, W / 2, 46);

  // Pips: one per region in its own light, filled to where the run ended.
  const idx = regionIndex(S.dist), pip = 7, gap = 3, turn = 7;
  const width = REGIONS.length * (pip + gap) - gap + turn;
  let x = W / 2 - width / 2;
  REGIONS.forEach((r, i) => {
    if (i === ASCENT_COUNT) x += turn;
    g.fillStyle = i <= idx ? rgb(r.glow)
      : rgb([r.glow[0] * .16, r.glow[1] * .16, r.glow[2] * .16]);
    g.fillRect(x, 62, pip, pip); x += pip + gap;
  });
  g.fillStyle = '#fff6d6';
  g.fillRect(W / 2 - width / 2 + ASCENT_COUNT * (pip + gap) + turn / 2 - 1, 60, 1, 11);

  g.font = '10px ui-monospace,Consolas,monospace';
  g.fillStyle = '#e2e2e2';
  const r = REGIONS[idx];
  g.fillText(`${idx >= ASCENT_COUNT ? '↓' : ''}${won ? 'ΛΕΛΥΤΑΙ' : r.name}   ${idx + 1}/${REGIONS.length}`,
             W / 2, 80);
  g.fillStyle = '#8c8c96';
  const mm = Math.floor(S.t / 60), ss = Math.floor(S.t % 60);
  g.fillText(`${mm}:${String(ss).padStart(2, '0')}    ${Math.round(S.dist)}`, W / 2, 94);
  g.fillStyle = '#6a6a76'; g.font = '9px ui-monospace,Consolas,monospace';
  g.fillText('PRESS TO TRY AGAIN', W / 2, 112);
}

// ---------------------------------------------------------------- main loop
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, DT_CLAMP); last = now;
  if (S.state === 'play') {
    S.t += dt;
    S.vy += (held ? THRUST : GRAVITY) * H * dt;
    S.vy = clamp(S.vy, -VY_MAX * H, VY_MAX * H);
    S.py += S.vy * dt;

    const adv = speedAt(S.dist) * dt;
    const before = S.dist; S.dist += adv; S.acc += adv;
    let cols = 0;
    while (S.acc >= 1) { S.cave.step(S.dist); S.acc -= 1; cols++; }

    if (before < DESCENT_START && S.dist >= DESCENT_START) {
      S.banner = 'ΠΕΡΙΑΓΩΓΗ'; S.flashT = 1.6;
    } else if (regionAt(before) !== regionAt(S.dist)) {
      S.banner = null; S.flashT = 0.5;
    } else if (S.flashT > 0) {
      S.flashT -= dt; if (S.flashT <= 0) S.banner = null;
    }

    S.trail = S.trail.map(p => [p[0] - cols, p[1], p[2]]).filter(p => p[0] >= 0);
    S.trail.push([PLAYER_X, S.py | 0, held]);
    if (S.trail.length > TRAIL_LEN) S.trail.shift();

    const [top, bot] = S.cave.bounds(PLAYER_X);
    if (S.py < top || S.py > bot) { S.state = 'dead'; saveBest(S.dist); }
    if (S.dist >= WIN_DIST) { S.state = 'won'; saveBest(S.dist); }
  }
  draw();
  hud();
  requestAnimationFrame(frame);
}

let fpsN = 0, fpsShown = 0, fpsT0 = 0;
const hudEl = document.getElementById('hud');
function hud() {
  if (++fpsN > 30) {
    fpsShown = Math.round(fpsN / (performance.now() - fpsT0) * 1000);
    fpsN = 0; fpsT0 = performance.now();
  }
  const i = regionIndex(S.dist), r = REGIONS[i];
  const mm = Math.floor(S.t / 60), ss = Math.floor(S.t % 60);
  hudEl.innerHTML =
    `<span><kbd>space</kbd> / tap to thrust</span>` +
    `<span class=live>${i >= ASCENT_COUNT ? '↓' : ''}${r.name} <b>${i + 1}</b>/${REGIONS.length}</span>` +
    `<span>${mm}:${String(ss).padStart(2, '0')}</span>` +
    `<span>best <b>${loadBest()}</b></span>` +
    `<span>${fpsShown} fps</span>`;
}

// The four constants the hardware build cannot yet answer for. Shown because
// this page exists to judge them, and "too floaty" is only actionable beside
// the number that causes it.
document.getElementById('tune').innerHTML = [
  ['gravity', GRAVITY], ['thrust', THRUST], ['vy max', VY_MAX],
  ['view close', VIEW_CLOSE],
].map(([k, v]) => `<span><i>${k}</i> ${v}</span>`).join('') +
  `<span><i>speed</i> ${SPEED_START}&rarr;${SPEED_DESC_END}</span>` +
  `<span><i>gap</i> ${GAP_START}&rarr;${GAP_DESC_MIN}&times;H</span>`;

fitCanvas(); reset(); fpsT0 = performance.now(); requestAnimationFrame(frame);
</script>
