# Are the committed artifacts still what the tools produce?
#
# The repository commits derived things -- C headers, the reference screens, the
# difficulty curves, the README's gameplay GIF -- and nothing re-derived them
# automatically. Twice that shipped artifacts describing a game that no longer
# existed, each found by eye weeks later. Generation is byte-reproducible, so
# regenerating and asking git whether anything moved is a sound check.
name: regen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy pillow

      # Two things are absent on a runner and both are gates. image/plato.png,
      # the source photograph, is not in the repository. And Consolas is not on
      # Linux -- the committed PNGs and the GIF were rendered with it, so a
      # different face moves pixels and a pixel difference from the font is not
      # staleness.
      #
      # So CI checks the two font-free generators, which are the
      # correctness-critical ones: constants.h and the page's generated block
      # must match cave.py. The image tools are named in regen.py's summary as
      # NOT CHECKED. The full check runs on the machine the artifacts are
      # actually generated on.
      - name: Regenerate and diff
        run: python tools/regen.py --check
