# Are the committed artifacts still what the tools produce?
#
# The repository commits derived things -- C headers, the reference screens, the
# difficulty curves, the README's gameplay GIF -- and nothing re-derived them
# automatically. Twice that shipped artifacts describing a game that no longer
# existed, each found by eye weeks later. Generation is byte-reproducible, so
# regenerating and asking git whether anything moved is a sound check.
name: regen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy pillow

      # Full coverage: image/plato.png is committed and the canonical font is
      # DejaVu Sans Mono, which the runner has. Both were once absent here --
      # the photograph by .gitignore, Consolas because it is Microsoft's -- and
      # this checked two of eight tools while saying so.
      - name: Regenerate and diff
        run: python tools/regen.py --check
